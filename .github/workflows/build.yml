name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build PigLauncher
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD"

      - name: Build debug + signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_COMMIT_SHA: ${{ github.sha }}
          APP_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Rename APKs
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="1.0.0-${GITHUB_SHA::7}"
          fi

          VERSION_CODE="${{ github.run_number }}"

          mv "app/build/outputs/apk/debug/app-debug.apk" \
             "app/build/outputs/apk/debug/PigLauncher_${VERSION_NAME}(${VERSION_CODE})-debug.apk"

          mv "app/build/outputs/apk/release/app-release.apk" \
             "app/build/outputs/apk/release/PigLauncher_${VERSION_NAME}(${VERSION_CODE}).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PigLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PigLauncher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_telegram:
    name: Push to Telegram Channel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PigLauncher-release-apk
          path: release-apk

      - name: Push release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH=$(find release-apk -name "*.apk" | head -n1)

          RAW_MESSAGE="${COMMIT_MESSAGE:-Manual trigger}"
          AUTHOR="${COMMIT_AUTHOR:-${{ github.actor }}}"
          SAFE_MESSAGE=$(printf '%s' "$RAW_MESSAGE" | tr -d '`')

          CAPTION=$(printf '🐷 PigLauncher Build\n\n```Branch:\n%s```\n```Commits:\n%s```\nby %s\n[Commit](%s)' \
            "$BRANCH_NAME" "$SAFE_MESSAGE" "$AUTHOR" "$COMMIT_URL")

          curl -F "chat_id=${TELEGRAM_CHAT_ID}" \
               -F "document=@${APK_PATH}" \
               -F "parse_mode=Markdown" \
               -F "caption=${CAPTION}" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
